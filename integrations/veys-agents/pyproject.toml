[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veys-agents"
version = "0.5.0"
description = "Local agency teams for client discovery, creative work and delivery"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
veys = "veys.__main__:main"

[project.entry-points."hermes_agent.plugins"]
veys = "veys:register"

[tool.setuptools]
packages = ["veys"]

[tool.setuptools.package-data]
veys = ["catalog/*.toml", "plugin.yaml"]
